[package]
name = "o2cloud"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cliente Linux no oficial para O2 Cloud (Telefónica España)"
license = "MIT"
repository = "https://example.invalid/o2cloud"
keywords = ["o2", "cloud", "cli", "telefonica", "storage"]
categories = ["command-line-utilities"]

[lib]
name = "o2cloud"
path = "src/lib.rs"

[[bin]]
name = "o2cloud"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
