[package]
name = "o2cloud"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cliente Linux no oficial para O2 Cloud (Telefónica España)"
license = "MIT"
repository = "https://example.invalid/o2cloud"
keywords = ["o2", "cloud", "cli", "telefonica", "storage"]
categories = ["command-line-utilities"]

[lib]
name = "o2cloud"
path = "src/lib.rs"

[[bin]]
name = "o2cloud"
path = "src/main.rs"

[[bin]]
name = "o2cloud-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", optional = true }
egui = { version = "0.36", optional = true }
futures-util = "0.3"
indicatif = "0.17"
rfd = { version = "0.17", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[features]
# Login con WebView embebida (requiere WebKitGTK 4.1 + GTK3 en Linux).
webview = ["dep:wry", "dep:gtk"]
# Interfaz gráfica nativa (eframe/egui).
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

# Backend de keyring por plataforma (el crate no trae ninguno por defecto).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

# WebView embebida (solo Linux en esta iteración).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
wry = { version = "0.57", default-features = false, features = ["os-webview"], optional = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
